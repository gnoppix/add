name: Add Desktop — Windows / macOS / Linux

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the action to upload release artifacts.
permissions:
  contents: write

# Network-hardening for cargo: intermittent registry/index timeouts were
# causing flaky failures. Retry fetches and give the index more time.
# CARGO_BUILD_JOBS caps parallelism so the heavy native builds (aws-lc-sys,
# ring, sequoia-nettle, sqlx) don't OOM the runner and get silently killed
# (which surfaces only as a bare nonzero exit with no captured error).
env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_TIMEOUT: "120"
  CARGO_HTTP_TIMEOUT: "120"
  # Minimum parallelism to avoid OOM-killing the heavy native builds
  # (aws-lc-sys prebuilt, ring -O3 C, sequoia-nettle, sqlx) on the
  # 7-14 GB GitHub-hosted runners. A cold build that exhausts RAM is
  # SIGKILLed with no stderr, surfacing only as a bare nonzero exit.
  # Single-job builds use the least peak memory.
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: "never"
  MAKEFLAGS: "-j1"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  # cc-rs (used by ring/sequoia-nettle build scripts) ignores
  # CARGO_BUILD_JOBS; it honors NUM_JOBS, so bound it too.
  NUM_JOBS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Windows (NSIS installer) — built natively on a Windows runner.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.97, MSVC)
        uses: dtolnay/rust-toolchain@1.97
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Install nettle/gmp build libs (sequoia-openpgp crypto-nettle)
        run: vcpkg install nettle gmp pkgconf --triplet x64-windows
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Build add core (x86_64-pc-windows-msvc)
        run: |
          $env:OPENSSL_STATIC="1"
          # add-client links sequoia-openpgp with crypto-nettle unconditionally,
          # so nettle (C lib + headers) must be discoverable. nettle-sys checks
          # NETTLE_INCLUDE_DIR/NETTLE_LIB_DIR before falling back to pkg-config,
          # so set them explicitly (no pkg-config on PATH needed). vcpkg's pkgconf
          # is also added to PATH as a fallback.
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT"
          $nettleInc = "$vcpkgRoot\installed\x64-windows\include"
          $nettleLib = "$vcpkgRoot\installed\x64-windows\lib"
          $env:NETTLE_INCLUDE_DIR = $nettleInc
          $env:NETTLE_LIB_DIR = $nettleLib
          $env:PKG_CONFIG_PATH = "$nettleLib\pkgconfig"
          $env:PATH = "$vcpkgRoot\installed\x64-windows\tools\pkgconf;$vcpkgRoot\installed\x64-windows\bin;$env:PATH"
          # Windows runs without TPM feature (tss-esapi requires native TPM libs)
          cargo build --package add-client --release --target x86_64-pc-windows-msvc --no-default-features 2>&1 | Tee-Object -FilePath build.log
          Get-Content build.log | Select-Object -Last 400 >> $env:GITHUB_STEP_SUMMARY
          if (Select-String -Path build.log -Pattern '^error') { exit 1 }
          Copy-Item target\\x86_64-pc-windows-msvc\\release\\add.exe target\\bundle\\add.exe

      - name: Install npm deps
        working-directory: desktop-ui
        run: npm ci

      - name: Build Electron app (NSIS)
        working-directory: desktop-ui
        shell: bash
        run: npm run build:react && npm run fix:index && ./node_modules/.bin/electron-builder --config electron-builder.js --win --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Diagnostics before upload
        working-directory: desktop-ui
        shell: bash
        run: |
          echo "=== staged add binary ==="; ls -la ../target/bundle/ || echo "NO target/bundle"
          echo "=== dist-electron contents ==="; ls -la dist-electron/ || echo "NO dist-electron"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: add-desktop-windows
          path: desktop-ui/dist-electron/*.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS (universal DMG) — built natively on a macOS runner.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.97, universal)
        uses: dtolnay/rust-toolchain@1.97
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Build add core (universal via lipo)
        run: |
          brew install nettle gmp pkg-config
          # add-client links sequoia-openpgp with crypto-nettle unconditionally,
          # so nettle (C lib + headers) must be discoverable. nettle-sys checks
          # NETTLE_INCLUDE_DIR/NETTLE_LIB_DIR before pkg-config, so set them
          # explicitly (pkg-config is not preinstalled on macos-latest).
          export NETTLE_INCLUDE_DIR="$(brew --prefix nettle)/include"
          export NETTLE_LIB_DIR="$(brew --prefix nettle)/lib"
          export PKG_CONFIG_PATH="$(brew --prefix nettle)/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L$(brew --prefix nettle)/lib -L$(brew --prefix gmp)/lib"
          export CPPFLAGS="-I$(brew --prefix nettle)/include -I$(brew --prefix gmp)/include"
          # macOS runs without TPM feature (tss-esapi requires native TPM libs)
          set -uo pipefail
          cargo build --package add-client --release --target x86_64-apple-darwin --no-default-features 2>&1 | tee /tmp/build.log || true
          cargo build --package add-client --release --target aarch64-apple-darwin --no-default-features 2>&1 | tee -a /tmp/build.log || true
          tail -n 400 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^error' /tmp/build.log && exit 1 || true
          mkdir -p target/bundle
          lipo -create \
            target/x86_64-apple-darwin/release/add \
            target/aarch64-apple-darwin/release/add \
            -output target/bundle/add
          chmod +x target/bundle/add

      - name: Install npm deps
        working-directory: desktop-ui
        run: npm ci

      - name: Build Electron app (DMG)
        working-directory: desktop-ui
        shell: bash
        run: npm run build:react && npm run fix:index && ./node_modules/.bin/electron-builder --config electron-builder.js --mac --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Diagnostics before upload
        working-directory: desktop-ui
        shell: bash
        run: |
          echo "=== staged add binary ==="; ls -la ../target/bundle/ || echo "NO target/bundle"
          echo "=== dist-electron contents ==="; ls -la dist-electron/ || echo "NO dist-electron"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: add-desktop-macos
          path: desktop-ui/dist-electron/*.dmg
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux (deb) — built natively on an Ubuntu runner.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.97)
        uses: dtolnay/rust-toolchain@1.97

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install TPM + crypto build libs
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libssl-dev nettle-dev libgmp-dev libclang-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Build add core (x86_64-unknown-linux-gnu)
        run: |
          # Linux uses TPM feature (requires tss-esapi packages)
          set -uo pipefail
          cargo build --package add-client --release --target x86_64-unknown-linux-gnu --features tpm 2>&1 | tee /tmp/build.log || true
          tail -n 400 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^error' /tmp/build.log && exit 1 || true
          mkdir -p target/bundle
          cp target/x86_64-unknown-linux-gnu/release/add target/bundle/add
          chmod +x target/bundle/add

      - name: Install npm deps
        working-directory: desktop-ui
        run: npm ci

      - name: Build Electron app (deb)
        working-directory: desktop-ui
        shell: bash
        run: npm run build:react && npm run fix:index && ./node_modules/.bin/electron-builder --config electron-builder.js --linux --publish=never

      - name: Diagnostics before upload
        working-directory: desktop-ui
        shell: bash
        run: |
          echo "=== staged add binary ==="; ls -la ../target/bundle/ || echo "NO target/bundle"
          echo "=== dist-electron contents ==="; ls -la dist-electron/ || echo "NO dist-electron"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: add-desktop-linux
          path: |
            desktop-ui/dist-electron/*.deb
            desktop-ui/dist-electron/*.AppImage
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Release — attach all artifacts to a GitHub Release on tag push.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/add-desktop-windows/*.exe
            artifacts/add-desktop-macos/*.dmg
            artifacts/add-desktop-linux/*.deb
            artifacts/add-desktop-linux/*.AppImage